[project]
name = "rotoscope-engine"
version = "0.0.1"
description = "RotoScope Studio inference engine — backend-agnostic (ROCm | DirectML | CUDA | CPU)"
readme = "README.md"
# 3.12 ist bewusst gepinnt: fuer 3.13/3.14 gibt es keine PyTorch-ROCm-Wheels.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
engine = "rotoscope_engine.__main__:main"

[project.optional-dependencies]
# Bewusst NICHT in den Default-Dependencies: die Wheels sind mehrere GB gross.
# Welcher Pfad gilt, entscheidet ADR 001 -- A (rocm) primaer, B (directml) sekundaer.

# Pfad A. Direkte URLs statt Index, weil AMD die Windows-Wheels nur so ausliefert.
# Versionen entsprechen der Messung in ADR 001; Aenderung heisst neu messen.
#
# Die Marker sind kein Zierrat: das sind win_amd64-Wheels. Ohne sie bricht
# `uv sync --extra rocm` auf einem Mac ab, statt die Gruppe einfach zu ueberspringen.
rocm = [
    # torch fordert rocm[libraries]==7.2.1 an -- das liegt nicht auf PyPI, sondern
    # nur bei AMD. Ohne diese vier Zeilen ist die Aufloesung unloesbar.
    "rocm[libraries] @ https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/rocm-7.2.1.tar.gz ; sys_platform == 'win32'",
    "rocm-sdk-core @ https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/rocm_sdk_core-7.2.1-py3-none-win_amd64.whl ; sys_platform == 'win32'",
    "rocm-sdk-devel @ https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/rocm_sdk_devel-7.2.1-py3-none-win_amd64.whl ; sys_platform == 'win32'",
    "rocm-sdk-libraries-custom @ https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/rocm_sdk_libraries_custom-7.2.1-py3-none-win_amd64.whl ; sys_platform == 'win32'",
    "torch @ https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/torch-2.9.1%2Brocm7.2.1-cp312-cp312-win_amd64.whl ; sys_platform == 'win32'",
    "torchvision @ https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/torchvision-0.24.1%2Brocm7.2.1-cp312-cp312-win_amd64.whl ; sys_platform == 'win32'",
]

# Pfad B, Windows: DirectX 12.
directml = ["onnxruntime-directml>=1.20 ; sys_platform == 'win32'", "numpy>=1.26"]

# Pfad B, macOS: dasselbe onnxruntime, nur mit CoreML statt DirectML als Beschleuniger.
# Damit laufen Tiefenkarten auf einem Mac ohne jede Aenderung am Code.
coreml = ["onnxruntime>=1.20 ; sys_platform == 'darwin'", "numpy>=1.26"]

# Torch auf Apple Silicon: normale Wheels, Beschleunigung ueber MPS.
mps = [
    "torch>=2.5 ; sys_platform == 'darwin'",
    "torchvision>=0.20 ; sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rotoscope_engine"]

# Noetig, weil die ROCm-Wheels als direkte URL referenziert werden (siehe rocm-Extra).
[tool.hatch.metadata]
allow-direct-references = true
