[project]
name = "rotoscope-engine"
version = "0.0.1"
description = "RotoScope Studio inference engine — backend-agnostic (ROCm | DirectML | CUDA | CPU)"
readme = "README.md"
# 3.12 ist bewusst gepinnt: fuer 3.13/3.14 gibt es keine PyTorch-ROCm-Wheels.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
engine = "rotoscope_engine.__main__:main"

[project.optional-dependencies]
# Bewusst NICHT in den Default-Dependencies: die Wheels sind mehrere GB gross und
# der Pfad haengt vom Ergebnis des M0-Spikes ab (scripts/spike/README.md).
directml = ["onnxruntime-directml>=1.20", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rotoscope_engine"]
